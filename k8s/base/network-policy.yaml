apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mentor-dns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: mentor
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mentor-traefik-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mentor-web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3001
---
# Existing IONOS pgvector endpoint, observed through pkubs. No firewall is changed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mentor-ionos-postgres
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [mentor-api, mentor-migrate]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 217.160.126.238/32
      ports:
        - protocol: TCP
          port: 5433
