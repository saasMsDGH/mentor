apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mentor-qual
resources:
  - ../../base
  - ingressroute.yaml
  - model.yaml
  - network-policy.yaml
# Activation still requires a rendered Application with approved image digests,
# operator-provisioned secrets and an explicit Argo CD sync.
replicas:
  - name: mentor-api
    count: 1
  - name: mentor-web
    count: 1
patches:
  - target:
      kind: Deployment
      name: mentor-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mentor-api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: CORS_ORIGINS
                    value: https://mentor.qual.dgsynthex.online
                  - name: CUSTOM_LLM_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: mentor-model-credentials
                        key: CUSTOM_LLM_API_KEY
                readinessProbe:
                  timeoutSeconds: 10
                  periodSeconds: 30
