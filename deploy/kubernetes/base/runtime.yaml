apiVersion: v1
kind: ServiceAccount
metadata:
  name: mentor-runtime
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mentor-uploads
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mentor-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mentor-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mentor-api
spec:
  # Deliberately inert: no image, secret or cluster endpoint has been qualified.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mentor-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mentor-api
    spec:
      serviceAccountName: mentor-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Placeholder only; replace with a reviewed image digest in an overlay.
          image: mentor-api:qualification-unconfigured
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: uploads
              mountPath: /app/uploads
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: AUTH_ENABLED
              value: "true"
            - name: DEPLOYMENT_MODE
              value: "multi_user"
            - name: APP_AUTO_CREATE_TABLES
              value: "false"
            - name: APP_AUTO_SEED_SYSTEM
              value: "false"
            - name: APP_RUN_SCHEDULER
              value: "false"
            - name: APP_RUN_ACTIVITY_ENGINE
              value: "false"
            - name: AMBIENT_MONITOR_ENABLED
              value: "false"
            - name: LLM_REQUIRED
              value: "true"
            - name: CODE_SANDBOX_BACKEND
              value: "container"
            - name: ALLOW_INSECURE_PROCESS_SANDBOX
              value: "false"
            - name: ENABLE_EXPERIMENTAL_BROWSER
              value: "false"
            - name: UPLOAD_DIR
              value: "/app/uploads"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: CORS_ORIGINS
              value: ""
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mentor-api-runtime
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mentor-api-runtime
                  key: JWT_SECRET_KEY
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: mentor-api-runtime
                  key: ENCRYPTION_KEY
            - name: LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: mentor-model-runtime
                  key: LLM_PROVIDER
            - name: CUSTOM_LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: mentor-model-runtime
                  key: CUSTOM_LLM_BASE_URL
            - name: CUSTOM_LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: mentor-model-runtime
                  key: CUSTOM_LLM_MODEL
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: uploads
          persistentVolumeClaim:
            claimName: mentor-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: mentor-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mentor-web
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mentor-web
spec:
  # Deliberately inert: no image, secret or cluster endpoint has been qualified.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mentor-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mentor-web
    spec:
      serviceAccountName: mentor-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Placeholder only; replace with a reviewed image digest in an overlay.
          image: mentor-web:qualification-unconfigured
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3001
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
