name: MENTOR baseline validation

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'wip/postgresql-*'
    paths:
      - .github/workflows/ci.yml
      - apps/**
      - deploy/kubernetes/**
      - deploy/argocd/**
      - deploy/images/**
      - k8s/**
      - tests/**
      - scripts/**
      - package*.json
      - pytest.ini
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mentor-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Backend unit tests, migrations and source compilation
    runs-on: [self-hosted, k8s-deploy]
    timeout-minutes: 30
    env:
      DISABLE_RATE_LIMIT: "1"
      CODE_SANDBOX_BACKEND: process
      # Only isolated unit tests: the upstream single-user fixture requires development mode.
      # NEVER use this setting for a deployed or network-accessible runtime.
      ENVIRONMENT: development
      DATABASE_URL: sqlite+aiosqlite:////tmp/mentor-ci-tests.db
    steps:
      - name: Verify dedicated self-hosted runner
        shell: bash
        run: |
          echo "Runner: ${{ runner.name }}"
          test "${{ runner.environment }}" = 'self-hosted'
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements-core.txt
            apps/api/requirements-full.txt
            apps/api/requirements-ci.txt
            apps/api/requirements-postgres.txt

      - name: Prepare isolated virtual environment
        shell: bash
        run: |
          VENV_PATH="$RUNNER_TEMP/mentor-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -m venv "$VENV_PATH"
          echo "$VENV_PATH/bin" >> "$GITHUB_PATH"
          echo "CI Python environment isolated at $VENV_PATH"

      - name: Install test dependencies (lightweight profile)
        shell: bash
        run: |
          # Validate pgvector processors instead of silently skipping them.
          python -m pip install --disable-pip-version-check --no-input -r apps/api/requirements-postgres.txt
          python -m pip check

      - name: Compile API sources
        run: python -m compileall -q apps/api

      - name: Install checksum-pinned manifest renderer
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          mkdir -p "$RUNNER_TEMP/mentor-tools"
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/mentor-tools/kubectl"
          echo "ebbd080e7c2e275093b55915722043257eb24004363e20acb3c4d71919f88336  $RUNNER_TEMP/mentor-tools/kubectl" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/mentor-tools/kubectl"
          echo "$RUNNER_TEMP/mentor-tools" >> "$GITHUB_PATH"

      - name: Run API unit tests
        run: python -m pytest tests/ -q --ignore=tests/test_sqlite_mode.py --timeout=60

      - name: Run SQLite application integration tests in a separate process
        shell: bash
        run: |
          # This module relies on an isolated event loop and app lifecycle.
          # Use a separate pytest process to prevent stale event-loop sharing.
          python -m pytest tests/test_sqlite_mode.py -q -o addopts= --timeout=60

      - name: Validate Alembic revision graph (SQLite skips migrations)
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/mentor-ci-alembic.db
          APP_AUTO_CREATE_TABLES: "false"
        run: |
          # SQLite's Alembic env intentionally skips applying migrations.
          # Checking the revision graph here is NOT PostgreSQL migration validation.
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          heads=ScriptDirectory.from_config(Config('alembic.ini')).get_heads()
          assert len(heads)==1, f'Expected one migration head, got {heads}'
          print('SQLite-only Alembic revision graph valid (PostgreSQL not tested):', heads)
          PY

  frontend:
    name: Frontend lint, unit tests and build
    runs-on: [self-hosted, k8s-deploy]
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
      API_INTERNAL_URL: http://mentor-api:8000/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Run Web lint
        working-directory: apps/web
        run: npm run lint

      - name: Run Web unit tests
        working-directory: apps/web
        run: npm run test:run

      - name: Run Web build
        working-directory: apps/web
        run: |
          npm run build
          node ../../scripts/check-web-build.mjs

  source-integrity:
    name: Source origin and workflow safety
    runs-on: [self-hosted, k8s-deploy]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate pinned upstream and avoid unreviewed workflows
        run: |
          test "$(cat docs/upstream/opentutor/UPSTREAM_COMMIT)" = "2d2c003654cfbc90c173c9db6867ae65a65e8313"
          grep -q 'MIT License' LICENSE
          sha256sum -c apps/web/src/app/fonts/SHA256SUMS
          test -e apps/api/main.py
          test -e apps/web/package.json
          test -e tests/test_fsrs.py
          test ! -e .github/workflows/deploy.yml
          echo "Source integrity check succeeded."

  runtime-images:
    name: Offline runtime images, authenticated API proxy and PostgreSQL restore
    needs: [checks, frontend, source-integrity]
    runs-on: [self-hosted, k8s-deploy]
    timeout-minutes: 30
    env:
      MENTOR_API_TEST_IMAGE: mentor-api:ci-${{ github.run_id }}-${{ github.run_attempt }}
      MENTOR_WEB_TEST_IMAGE: mentor-web:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require an isolated local container engine
        shell: bash
        run: |
          if ! docker --host unix:///var/run/docker.sock info >/dev/null 2>&1; then
            echo '::error::Runtime qualification requires an isolated CI container engine. The current k8s-deploy runner has no local Docker daemon. Provision a separate CI runner with the requested self-hosted/k8s-deploy labels; do not mount a deployment host socket or skip this check.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare isolated test environment
        shell: bash
        run: |
          VENV_PATH="$RUNNER_TEMP/mentor-images-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -m venv "$VENV_PATH"
          echo "$VENV_PATH/bin" >> "$GITHUB_PATH"
      - name: Install validation dependencies
        run: python -m pip install -r apps/api/requirements-postgres.txt
      - name: Prepare locked public dependency bundles
        run: |
          python scripts/prepare_runtime_dependencies.py api
          python scripts/prepare_runtime_dependencies.py web
      - name: Build runtime images without build network access
        run: |
          docker --host unix:///var/run/docker.sock build --network none --build-arg SOURCE_REVISION="$GITHUB_SHA" -f deploy/images/api.Dockerfile -t "$MENTOR_API_TEST_IMAGE" .
          docker --host unix:///var/run/docker.sock build --network none --build-arg SOURCE_REVISION="$GITHUB_SHA" -f deploy/images/web.Dockerfile -t "$MENTOR_WEB_TEST_IMAGE" .
      - name: Test isolated images and database restore
        run: |
          docker --host unix:///var/run/docker.sock pull pgvector/pgvector@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
          python scripts/test_postgres.py
      - name: Remove only this run's temporary image tags
        if: always()
        run: |
          docker --host unix:///var/run/docker.sock image rm "$MENTOR_API_TEST_IMAGE" "$MENTOR_WEB_TEST_IMAGE" || true
